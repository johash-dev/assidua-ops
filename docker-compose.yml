services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: assidua
      POSTGRES_PASSWORD: assidua
      POSTGRES_DB: assidua_ops
    ports:
      - "5433:5432"
    volumes:
      - assidua_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assidua -d assidua_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assidua_pg:
